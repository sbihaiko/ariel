name: CI

on:
  push:
    branches: [master, dev]
    tags:
      - "*"
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    branches: [master, dev]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.event_name  }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout SDK
      uses: actions/checkout@v3
      with:
        repository: ps5-payload-dev/sdk
        path: sdk

    - name: Setup SDK
      working-directory: sdk
      run: |
        sudo apt update
        sudo apt install xxd clang-18 lld-18
        make DESTDIR=${{ runner.tool_cache }}/ps5-payload-sdk clean install
        echo PS5_PAYLOAD_SDK=${{ runner.tool_cache }}/ps5-payload-sdk >> $GITHUB_ENV

    - name: Checkout Payload
      uses: actions/checkout@v3

    - name: Build Payload
      run: |
        make clean all

    - name: Upload Payload
      uses: actions/upload-artifact@v4
      with:
        name: Payload
        path: ariel-ps5.elf
        if-no-files-found: error

# No job here publishes a release. A build made on a runner pins no anchor:
# ARIEL_PUBKEY and ARIEL_RECOVERY_PUBKEY are empty, so ps5_anchor() answers -1
# and the payload can approve nothing, while the notes say the key never leaves
# the owner's computer and the release is source only. Attaching that binary
# advertised one every owner would have to replace, and marking the release a
# pre-release hid it from the sidebar. A tag keeps its build as the workflow
# artifact above; the release itself is made by hand, with notes, from a build
# the owner made with their own two keys.
